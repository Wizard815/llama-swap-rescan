services:
  llama-swap:
    image: ${IMAGE_TAG}
    container_name: llama-swap
    restart: unless-stopped
    ports:
      - "${LISTEN_PORT}:8080"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
    volumes:
      - ${CONFIG_FILE}:/app/config.yaml:ro
      - ${CONFIG_DIR}:/app/config.d
      - ${MODELS_DIR}:/app/models
